name: Build Unsigned APK

on:
  push:
    branches: [ "claude/cat-finder-android-app-ZOsAu", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             artifacts/WhereIsKitty-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsKitty-unsigned-apk
          path: artifacts/WhereIsKitty-unsigned.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Unsigned APK has been uploaded as a build artifact." >> $GITHUB_STEP_SUMMARY
          echo "Download it from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -sh artifacts/WhereIsKitty-unsigned.apk | cut -f1)
          echo "APK size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
